[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sameer Chaudhary", email = "154604600+AdmGenSameer@users.noreply.github.com" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "joblib>=1.3.0"
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
